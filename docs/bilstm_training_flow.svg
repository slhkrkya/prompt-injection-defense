<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="aBlue"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3A7BD5"/></marker>
    <marker id="aGreen"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5BAD6F"/></marker>
    <marker id="aGray"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#777"/></marker>
    <marker id="aOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#E8803A"/></marker>
    <marker id="aGold"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#D4B840"/></marker>
    <marker id="aCyan"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3ABFBF"/></marker>
    <marker id="aPink"   markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#C06090"/></marker>
    <marker id="aRed"    markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#E05050"/></marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="820" fill="#0d0f1a" rx="14"/>

  <!-- Title -->
  <text x="480" y="34" text-anchor="middle" fill="#E0E0F0" font-size="16" font-weight="bold">Bi-LSTM Injection Detector — Eğitim Akışı</text>
  <text x="480" y="52" text-anchor="middle" fill="#555" font-size="11">Model: InjectionDetector  •  Veri: AlpacaFarm + deepset + rogue-security + HackAPrompt  •  Çerçeve: PyTorch</text>

  <!-- ══ DATA SOURCES (4 kutu) ══ -->
  <!-- Alpaca -->
  <rect x="10"  y="68" width="210" height="52" rx="7" fill="#211f0a" stroke="#D4B840" stroke-width="1.5"/>
  <text x="115" y="90"  text-anchor="middle" fill="#F0D060" font-size="11" font-weight="bold">davinci_003_outputs.json</text>
  <text x="115" y="108" text-anchor="middle" fill="#A08030" font-size="10">train %80 (~644)  •  eval %20 → Qwen ASR</text>

  <!-- deepset -->
  <rect x="235" y="68" width="210" height="52" rx="7" fill="#0a1f1f" stroke="#3ABFBF" stroke-width="1.5"/>
  <text x="340" y="90"  text-anchor="middle" fill="#60E0E0" font-size="11" font-weight="bold">deepset/prompt-injections</text>
  <text x="340" y="108" text-anchor="middle" fill="#2A8080" font-size="10">train split  •  546 örnek</text>

  <!-- rogue-security -->
  <rect x="460" y="68" width="210" height="52" rx="7" fill="#1a0a1f" stroke="#C06090" stroke-width="1.5"/>
  <text x="565" y="90"  text-anchor="middle" fill="#E080C0" font-size="11" font-weight="bold">rogue-security benchmark</text>
  <text x="565" y="108" text-anchor="middle" fill="#804060" font-size="10">test.csv  •  5 000 örnek</text>

  <!-- HackAPrompt -->
  <rect x="685" y="68" width="265" height="52" rx="7" fill="#0f1a0a" stroke="#E05050" stroke-width="1.5"/>
  <text x="817" y="90"  text-anchor="middle" fill="#FF8080" font-size="11" font-weight="bold">HackAPrompt Competition</text>
  <text x="817" y="108" text-anchor="middle" fill="#803030" font-size="10">hackaprompt/hackaprompt-dataset  •  10 000 örnek</text>

  <!-- arrows from Alpaca → clean + attack -->
  <line x1="75"  y1="120" x2="60"  y2="168" stroke="#5BAD6F" stroke-width="1.5" marker-end="url(#aGreen)"/>
  <line x1="155" y1="120" x2="590" y2="168" stroke="#E8803A" stroke-width="1.5" marker-end="url(#aOrange)"/>

  <!-- arrows from deepset → both -->
  <line x1="340" y1="120" x2="340" y2="148" stroke="#3ABFBF" stroke-width="1.5"/>
  <line x1="340" y1="148" x2="130" y2="168" stroke="#3ABFBF" stroke-width="1.5" marker-end="url(#aCyan)"/>
  <line x1="340" y1="148" x2="620" y2="168" stroke="#3ABFBF" stroke-width="1.5" marker-end="url(#aCyan)"/>

  <!-- arrows from rogue-security → both -->
  <line x1="565" y1="120" x2="565" y2="148" stroke="#C06090" stroke-width="1.5"/>
  <line x1="565" y1="148" x2="160" y2="168" stroke="#C06090" stroke-width="1.5" marker-end="url(#aPink)"/>
  <line x1="565" y1="148" x2="650" y2="168" stroke="#C06090" stroke-width="1.5" marker-end="url(#aPink)"/>

  <!-- arrow from HackAPrompt → attack only -->
  <line x1="817" y1="120" x2="760" y2="168" stroke="#E05050" stroke-width="1.5" marker-end="url(#aRed)"/>

  <!-- ── CLEAN EXAMPLES ── -->
  <rect x="10"  y="170" width="280" height="72" rx="7" fill="#112211" stroke="#5BAD6F" stroke-width="1.5"/>
  <rect x="10"  y="170" width="280" height="22" rx="7" fill="#5BAD6F"/>
  <rect x="10"  y="184" width="280" height="8"  fill="#5BAD6F"/>
  <text x="150" y="186" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Temiz Örnekler  |  label = 0</text>
  <text x="26"  y="210" fill="#88DD88" font-size="11">• Alpaca train %80 row["input"] + deepset benign</text>
  <text x="26"  y="228" fill="#88DD88" font-size="11">• + rogue-security benign  (~4 149 toplam)</text>

  <!-- ── ATTACK EXAMPLES ── -->
  <rect x="560" y="170" width="380" height="72" rx="7" fill="#1f0a0a" stroke="#E8803A" stroke-width="1.5"/>
  <rect x="560" y="170" width="380" height="22" rx="7" fill="#E8803A"/>
  <rect x="560" y="184" width="380" height="8"  fill="#E8803A"/>
  <text x="750" y="186" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Saldırılı Örnekler  |  label = 1</text>
  <text x="576" y="210" fill="#FFAA77" font-size="11">• ignore / completion / completion_ignore (Alpaca train %80) + deepset &amp; rogue injection</text>
  <text x="576" y="228" fill="#FFAA77" font-size="11">• + HackAPrompt 10 000 gerçek saldırı  (~12 600 toplam)</text>

  <!-- merge arrows to tokenizer -->
  <line x1="150" y1="242" x2="400" y2="338" stroke="#5BAD6F" stroke-width="1.5" marker-end="url(#aGreen)"/>
  <line x1="750" y1="242" x2="540" y2="338" stroke="#E8803A" stroke-width="1.5" marker-end="url(#aOrange)"/>

  <!-- ── TOKENIZER ── -->
  <rect x="280" y="340" width="400" height="52" rx="7" fill="#111d2e" stroke="#3A7BD5" stroke-width="1.5"/>
  <text x="480" y="361" text-anchor="middle" fill="#7EB8F7" font-size="13" font-weight="bold">WordTokenizer</text>
  <text x="480" y="380" text-anchor="middle" fill="#4A88C7" font-size="11">build_vocab(train_texts)  →  vocab 10 000 token  •  PAD=0  UNK=1</text>

  <!-- arrow -->
  <line x1="480" y1="392" x2="480" y2="422" stroke="#777" stroke-width="1.5" marker-end="url(#aGray)"/>

  <!-- ── DATASET ── -->
  <rect x="280" y="424" width="400" height="52" rx="7" fill="#1a1430" stroke="#9B59B6" stroke-width="1.5"/>
  <text x="480" y="445" text-anchor="middle" fill="#CC88FF" font-size="13" font-weight="bold">InjectionDataset</text>
  <text x="480" y="464" text-anchor="middle" fill="#8855AA" font-size="11">encode(text, max_len=512)  •  %80 train  /  %20 val  •  collate + padding</text>

  <!-- arrow -->
  <line x1="480" y1="476" x2="480" y2="506" stroke="#777" stroke-width="1.5" marker-end="url(#aGray)"/>

  <!-- ── MODEL ── -->
  <rect x="170" y="508" width="620" height="100" rx="7" fill="#101a10" stroke="#44AA44" stroke-width="1.5"/>
  <rect x="170" y="508" width="620" height="22"  rx="7" fill="#44AA44"/>
  <rect x="170" y="522" width="620" height="8"   fill="#44AA44"/>
  <text x="480" y="524" text-anchor="middle" fill="white" font-size="12" font-weight="bold">InjectionDetector  (Bi-LSTM)</text>
  <text x="188" y="549" fill="#88DD88" font-size="11">• Embedding(vocab_size, 128)  →  BiLSTM(128→256, layers=2, dropout=0.3)</text>
  <text x="188" y="567" fill="#88DD88" font-size="11">• Linear(512→1)  •  BCEWithLogitsLoss  •  Adam lr=1e-3  •  20 epoch  •  early stop (patience=5)</text>
  <text x="188" y="585" fill="#44AA44" font-size="11">• val_acc = %94.2  •  threshold = 0.3  (OOD: F1=0.841, Precision=0.957, Recall=0.750)</text>

  <!-- arrow -->
  <line x1="480" y1="608" x2="480" y2="638" stroke="#D4B840" stroke-width="1.5" marker-end="url(#aGold)"/>

  <!-- ── CHECKPOINT ── -->
  <rect x="280" y="640" width="400" height="40" rx="7" fill="#211f0a" stroke="#D4B840" stroke-width="1.5"/>
  <text x="480" y="657" text-anchor="middle" fill="#F0D060" font-size="12" font-weight="bold">bilstm_checkpoint.pt</text>
  <text x="480" y="672" text-anchor="middle" fill="#A08030" font-size="11">model_state_dict  +  vocab  +  model_kwargs  +  val_acc</text>

  <!-- ── DATA SUMMARY ── -->
  <rect x="280" y="698" width="400" height="102" rx="7" fill="#0d1520" stroke="#3A7BD5" stroke-width="1"/>
  <text x="480" y="716" text-anchor="middle" fill="#7EB8F7" font-size="11" font-weight="bold">Eğitim Verisi Özeti</text>
  <text x="298" y="734" fill="#4A88C7" font-size="10">• Alpaca sentetik saldırılar (train %80) :  ~  499 örnek</text>
  <text x="298" y="749" fill="#4A88C7" font-size="10">• deepset train split                 :    546 örnek</text>
  <text x="298" y="764" fill="#4A88C7" font-size="10">• rogue-security benchmark       :  5 000 örnek</text>
  <text x="298" y="779" fill="#4A88C7" font-size="10">• HackAPrompt competition       : 10 000 örnek</text>
  <text x="480" y="793" text-anchor="middle" fill="#3A7BD5" font-size="10" font-weight="bold">Toplam  ≈  16 350 örnek  (pozitif: 12 600  •  negatif: ~3 750)  •  Qwen test verisi hariç</text>
</svg>
